# 公共配置：模型 / 数据 / 训练
model:
  name: "Qwen/Qwen2.5-VL-7B-Instruct"
  torch_dtype: "bfloat16"
  max_image_tokens: 1024
  trust_remote_code: true

data:
  train_path: "data/train_hard.jsonl"          # 难度筛选后的约 2 万条高难度样本（本地生成，不入库）
  counterfactual_path: "data/counterfactual_pairs.jsonl"  # 约 2 万组 EP/EA 配对（本地生成）
  image_root: "data/images"
  max_seq_len: 2048

training:
  output_dir: "outputs/grpo"
  learning_rate: 1.0e-6
  per_device_batch_size: 4
  gradient_accumulation_steps: 4
  num_epochs: 2
  warmup_ratio: 0.05
  logging_steps: 10
  save_steps: 500
  seed: 42
  bf16: true

grpo:
  group_size: 8          # 每组采样数，用于组内相对优势
  beta_kl: 0.04          # 参考模型 KL 惩罚系数
  clip_epsilon: 0.2
  temperature: 1.0
