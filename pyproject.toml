[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scichart-evidence-vl"
version = "0.1.0"
description = "Visual-evidence-driven framework based on Qwen2.5-VL for scientific chart understanding"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.49.0",
    "accelerate>=0.28.0",
    "peft>=0.10.0",
    "trl>=0.12.0",
    "datasets>=2.18.0",
    "numpy>=1.26.0",
    "pillow>=10.0.0",
    "matplotlib>=3.8.0",
    "pyyaml>=6.0",
    "tqdm>=4.66.0",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100
